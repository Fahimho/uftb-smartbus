[env:seeed_xiao_esp32s3]
platform = espressif32@6.7.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- OTA SETTINGS ---
; By default, we leave the protocol blank so USB works automatically.
; When you want OTA, you will type the protocol in the terminal.
upload_port = 192.168.0.100 

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

; --- DISABLE LTO TO FIX WINDOWS COMMAND LINE LIMIT ---
build_unflags = -flto
build_flags =
    -fno-lto
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_DEV
    -mfix-esp32-psram-cache-issue
    
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    miguelbalboa/MFRC522@^1.4.11
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.0
    mikalhart/TinyGPSPlus@^1.0.3
    knolleary/PubSubClient@^2.8
    tzapu/WiFiManager@^2.0.17
; PlatformIO Project Configuration
; UFTB SmartBus — ESP32-S3 Sense firmware
; Pinned versions: do not float. Update deliberately.

[env:seeed_xiao_esp32s3]
platform = espressif32@6.7.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Board has 8MB PSRAM and 8MB flash on Sense variant
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

lib_deps =
    ; Pinned later — MFRC522, SD, TinyGPSPlus, etc.
    ; Do not add here until Phase 4 bench validation.